<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb;
        font-family: Inter, system-ui, sans-serif; color: #18202a; }
      form { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px;
        width: min(360px, calc(100% - 32px)); box-shadow: 0 10px 30px rgba(15,23,42,.07); }
      h1 { margin: 0 0 16px; font-size: 22px; }
      input { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 10px;
        padding: 11px 12px; font: inherit; margin-bottom: 12px; }
      button { width: 100%; border: 0; border-radius: 10px; padding: 11px; font: inherit;
        font-weight: 700; background: #2563eb; color: #fff; cursor: pointer; }
      #err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <form id="f">
      <h1>Shop login</h1>
      <input id="p" type="password" placeholder="Password" autofocus required />
      <button type="submit">Log in</button>
      <div id="err"></div>
    </form>
    <script>
      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        err.textContent = "";
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("p").value }),
        });
        if (r.ok) {
          const next = new URLSearchParams(location.search).get("next") || "/";
          location.replace(next.startsWith("/") && !next.startsWith("//") ? next : "/");
        } else {
          err.textContent = (await r.json()).error || "Login failed.";
        }
      });
    </script>
  </body>
</html>
