<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>گزارش ماهانه · ZRCO</title>
    <style>
      @font-face {
        font-family: Vazirmatn;
        src:
          local("Vazirmatn"),
          url(fonts/Vazirmatn.woff2) format("woff2");
        font-display: swap;
      }
      :root {
        --bg: #f5f5f7;
        --card: #fff;
        --ink: #1d1d1f;
        --mut: #6e6e73;
        --line: #e8e8ed;
        --blue: #0071e3;
        --green: #28a745;
        --red: #e5303d;
        --amber: #f59e0b;
        --violet: #6e56cf;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      @page {
        size: A4;
        margin: 14mm 12mm 16mm;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Vazirmatn,
          "SF Pro Display",
          -apple-system,
          "Segoe UI",
          Tahoma,
          sans-serif;
        direction: rtl;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font-family: inherit;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(245, 245, 247, 0.78);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .topin {
        width: min(1180px, calc(100% - 32px));
        margin: auto;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 54px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        letter-spacing: 0.14em;
        font-size: 15px;
        text-decoration: none;
        color: var(--ink);
      }
      .logo {
        width: 28px;
        height: 28px;
      }
      .tnav {
        display: flex;
        gap: 2px;
        margin-right: auto;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tnav a {
        font-size: 13px;
        color: var(--mut);
        text-decoration: none;
        padding: 6px 11px;
        border-radius: 99px;
        white-space: nowrap;
        transition: 0.25s;
      }
      .tnav a:hover {
        color: var(--ink);
        background: rgba(0, 0, 0, 0.05);
      }
      .tnav a.on {
        color: #fff;
        background: var(--ink);
      }
      .wrap {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 30px 0 80px;
      }
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .head h1 {
        margin: 0;
        font-size: clamp(28px, 4.5vw, 40px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .head p {
        margin: 4px 0 0;
        color: var(--mut);
        font-size: 14px;
      }
      .acts {
        display: flex;
        gap: 8px;
      }
      .btn {
        border: 0;
        border-radius: 99px;
        padding: 9px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: var(--blue);
        color: #fff;
        transition: 0.25s var(--ease);
      }
      .btn:hover {
        transform: scale(1.04);
        filter: brightness(1.08);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn.g {
        background: #fff;
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .seg {
        display: flex;
        gap: 4px;
        background: rgba(0, 0, 0, 0.06);
        padding: 4px;
        border-radius: 14px;
        overflow-x: auto;
        scrollbar-width: none;
        margin-bottom: 22px;
      }
      .seg button {
        flex: none;
        border: 0;
        background: transparent;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--mut);
        cursor: pointer;
        transition: 0.3s var(--ease);
      }
      .seg button.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }
      .rv {
        opacity: 0;
        transform: translateY(26px);
        transition:
          opacity 0.8s var(--ease),
          transform 0.8s var(--ease);
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 24px;
        margin-bottom: 18px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 8px 30px rgba(0, 0, 0, 0.04);
        min-width: 0;
      }
      .card h3 {
        margin: 0 0 3px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .card .sub {
        margin: 0 0 16px;
        color: var(--mut);
        font-size: 13px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 30px;
        align-items: center;
        padding: 34px;
      }
      .hero .y {
        color: var(--mut);
        font-weight: 600;
        font-size: 15px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hero h2 {
        margin: 2px 0 12px;
        font-size: clamp(52px, 10vw, 100px);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #1d1d1f, #4a4a52);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .story {
        margin: 0;
        max-width: 58ch;
        line-height: 2.1;
        color: #424245;
        font-size: 15px;
      }
      .story b {
        color: var(--ink);
      }
      .pill {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        background: var(--bg);
        border-radius: 99px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--mut);
        cursor: pointer;
        border: 0;
        transition: 0.2s;
      }
      .pill:hover {
        background: #e8e8ed;
        color: var(--ink);
      }
      .ringbox {
        text-align: center;
        position: relative;
        width: 230px;
      }
      .ring {
        transform: rotate(-90deg);
        width: 210px;
        height: 210px;
      }
      .ring circle {
        fill: none;
        stroke-width: 9;
        stroke-linecap: round;
      }
      .ring .bg {
        stroke: var(--bg);
      }
      .ring .fg {
        stroke: var(--green);
        animation: ring 1.6s var(--ease) both 0.2s;
      }
      .ringc {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
      }
      .ringc small {
        color: var(--mut);
        font-size: 12px;
        font-weight: 600;
      }
      .ringc .big {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 2px 0;
      }
      .ringc .big.neg {
        color: var(--red);
      }
      .ringc .usd {
        font-size: 12px;
        color: var(--mut);
      }
      .gt {
        font-size: 13px;
        font-weight: 700;
        color: var(--mut);
        margin: 26px 4px 10px;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }
      .kpi {
        background: var(--card);
        border-radius: 20px;
        padding: 18px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 6px 20px rgba(0, 0, 0, 0.03);
        transition: 0.4s var(--ease);
        position: relative;
        overflow: hidden;
      }
      .kpi:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.08);
      }
      .kpi:before {
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: 4px;
        height: 100%;
        background: var(--c);
      }
      .kpi .k {
        font-size: 12.5px;
        color: var(--mut);
        font-weight: 600;
      }
      .kpi .v {
        font-size: 22px;
        font-weight: 800;
        margin: 6px 0 2px;
        letter-spacing: -0.02em;
      }
      .kpi .v small {
        font-size: 11px;
        font-weight: 600;
        color: var(--mut);
        margin-right: 4px;
      }
      .kpi .u {
        font-size: 11.5px;
        color: var(--mut);
      }
      .d {
        font-size: 12px;
        font-weight: 700;
        margin-top: 3px;
      }
      .up {
        color: var(--green);
      }
      .down {
        color: var(--red);
      }
      .flat {
        color: var(--mut);
      }
      .hl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
        margin: 18px 0;
      }
      .hl div {
        background: var(--card);
        border-radius: 18px;
        padding: 14px 16px;
        font-size: 12.5px;
        color: var(--mut);
      }
      .hl b {
        display: block;
        color: var(--ink);
        font-size: 14px;
        margin-top: 4px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .grid2.w {
        grid-template-columns: 1.45fr 1fr;
      }
      .grid2 .card {
        margin: 0;
      }
      svg {
        max-width: 100%;
        display: block;
      }
      .sc {
        overflow-x: auto;
      }
      .rise {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: rise 1s var(--ease) both;
        animation-delay: calc(var(--i) * 22ms);
      }
      .sc rect[data-day] {
        cursor: pointer;
      }
      .sc rect[data-day]:hover {
        opacity: 0.7;
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--mut);
        margin-top: 10px;
      }
      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-left: 6px;
        background: var(--c);
      }
      .dw {
        display: flex;
        gap: 26px;
        align-items: center;
        flex-wrap: wrap;
      }
      .donut {
        animation: spin 1.3s var(--ease) both;
      }
      .donut circle.seg {
        animation: dash 1.4s var(--ease) both;
      }
      .rank {
        max-height: 350px;
        overflow: auto;
      }
      .rk {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .rk:last-child {
        border: 0;
      }
      .rk .n {
        font-weight: 600;
      }
      .rk .a {
        font-weight: 700;
        white-space: nowrap;
      }
      .rk small {
        color: var(--mut);
        font-weight: 400;
      }
      .rk .t {
        grid-column: 1/3;
        height: 5px;
        background: var(--bg);
        border-radius: 9px;
        overflow: hidden;
      }
      .rk .t i {
        display: block;
        height: 100%;
        width: var(--w);
        background: var(--c);
        border-radius: 9px;
        animation: fill 1.2s var(--ease) both;
        animation-delay: calc(var(--i) * 60ms);
      }
      .tg {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        border-radius: 99px;
        padding: 2px 8px;
        margin-right: 6px;
        background: var(--bg);
        color: var(--mut);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        color: var(--mut);
        font-weight: 600;
        font-size: 12px;
        text-align: right;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        text-align: right;
      }
      tr:last-child td {
        border: 0;
      }
      .num {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .tw {
        overflow-x: auto;
      }
      details {
        border-radius: 16px;
        margin-bottom: 8px;
        background: var(--bg);
        overflow: hidden;
      }
      summary {
        cursor: pointer;
        padding: 13px 16px;
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      details[open] summary {
        border-bottom: 1px solid var(--line);
      }
      details .tw {
        padding: 6px 12px 12px;
        background: #fff;
      }
      .st {
        font-size: 11px;
        font-weight: 700;
        border-radius: 99px;
        padding: 2px 9px;
        margin-right: 6px;
      }
      .st.ok {
        background: #e3f6e8;
        color: #1d7a35;
      }
      .st.warn {
        background: #fdf0d5;
        color: #a15c07;
      }
      .st.bad {
        background: #fde4e6;
        color: #b42332;
      }
      .empty {
        padding: 26px;
        text-align: center;
        color: var(--mut);
        font-size: 13px;
      }
      .weeks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .wk {
        background: var(--bg);
        border-radius: 18px;
        padding: 16px;
        transition: 0.4s var(--ease);
      }
      .wk:hover {
        transform: translateY(-3px);
      }
      .wk .r {
        font-size: 12px;
        color: var(--mut);
        font-weight: 600;
      }
      .wk .nv {
        font-size: 19px;
        font-weight: 800;
        margin: 4px 0 8px;
      }
      .wk .l {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--mut);
        margin-top: 3px;
      }
      .wk .b {
        height: 5px;
        background: #e3e3e8;
        border-radius: 9px;
        margin-top: 10px;
        overflow: hidden;
      }
      .wk .b i {
        display: block;
        height: 100%;
        width: var(--w);
        background: var(--blue);
        border-radius: 9px;
        animation: fill 1.2s var(--ease) both;
      }
      .tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .srch {
        flex: 1;
        min-width: 200px;
        border: 0;
        background: var(--bg);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13.5px;
        outline: none;
        transition: 0.25s;
      }
      .srch:focus {
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.25);
        background: #fff;
      }
      .days {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .day {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 16px;
        padding: 14px;
        border-radius: 20px;
        background: var(--bg);
        scroll-margin-top: 80px;
      }
      .day.fri {
        background: #fbf6ec;
      }
      .day.today {
        box-shadow: inset 0 0 0 2px var(--blue);
      }
      .day.flash {
        animation: flash 1.6s;
      }
      .day.quiet {
        padding: 9px 14px;
        background: transparent;
        border: 1px dashed var(--line);
      }
      .db {
        text-align: center;
        align-self: start;
      }
      .db b {
        display: block;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
      }
      .db small {
        font-size: 11px;
        color: var(--mut);
        font-weight: 600;
      }
      .quiet .db b {
        font-size: 20px;
        color: var(--mut);
      }
      .dchips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .dchips span {
        background: #fff;
        border-radius: 99px;
        padding: 3px 11px;
        font-size: 12px;
        font-weight: 700;
      }
      .dbar {
        display: flex;
        gap: 3px;
        height: 4px;
        margin-bottom: 6px;
      }
      .dbar i {
        display: block;
        border-radius: 4px;
        width: var(--w);
        animation: fill 1.2s var(--ease) both;
      }
      .ev {
        background: #fff;
        border-radius: 14px;
        padding: 10px 13px;
        margin-top: 6px;
        display: flex;
        gap: 10px;
        font-size: 13px;
      }
      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-top: 7px;
      }
      .evb {
        flex: 1;
        min-width: 0;
      }
      .ev .h {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-weight: 600;
      }
      .ev .h em {
        font-style: normal;
        font-size: 11px;
        font-weight: 700;
        margin-left: 6px;
      }
      .ev .m {
        color: var(--mut);
        font-size: 12px;
        margin-top: 2px;
        line-height: 1.9;
      }
      .ev ul {
        margin: 4px 0 0;
        padding-right: 18px;
        color: var(--mut);
        font-size: 12px;
        line-height: 1.9;
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .th {
        width: 42px;
        height: 42px;
        object-fit: cover;
        border-radius: 10px;
        margin-top: 6px;
        cursor: zoom-in;
        transition: 0.3s var(--ease);
      }
      .th.big {
        width: 240px;
        height: auto;
        cursor: zoom-out;
      }
      .foot {
        text-align: center;
        color: var(--mut);
        font-size: 12px;
        margin-top: 30px;
      }
      .printhead,
      .pfoot {
        display: none;
      }
      @keyframes rise {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes fill {
        from {
          width: 0;
        }
      }
      @keyframes dash {
        from {
          stroke-dasharray: 0 100;
        }
      }
      @keyframes ring {
        from {
          stroke-dasharray: 0 600;
        }
      }
      @keyframes spin {
        from {
          transform: rotate(-90deg) scale(0.85);
          opacity: 0;
        }
      }
      @keyframes flash {
        0%,
        60% {
          box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.45);
        }
      }
      @media (max-width: 860px) {
        .hero,
        .grid2,
        .grid2.w {
          grid-template-columns: 1fr;
        }
        .hero {
          padding: 24px;
        }
        .ringbox {
          margin: auto;
        }
        .day {
          grid-template-columns: 54px 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .rv {
          opacity: 1;
          transform: none;
        }
      }
      @media print {
        html {
          font-size: 11px;
        }
        body {
          background: #fff;
        }
        * {
          animation: none !important;
          transition: none !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .top,
        .head,
        .seg,
        .tools,
        #more,
        .acts {
          display: none !important;
        }
        .wrap {
          width: 100%;
          padding: 0;
        }
        .rv {
          opacity: 1 !important;
          transform: none !important;
        }
        .printhead {
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-bottom: 2px solid var(--ink);
          padding-bottom: 8px;
          margin-bottom: 14px;
        }
        .printhead .brand {
          font-size: 16px;
        }
        .printhead small {
          color: var(--mut);
          font-size: 11px;
          display: block;
          text-align: left;
        }
        .pfoot {
          display: block;
          position: fixed;
          bottom: 0;
          right: 0;
          left: 0;
          text-align: center;
          color: var(--mut);
          font-size: 9.5px;
          border-top: 1px solid var(--line);
          padding-top: 4px;
          background: #fff;
        }
        .card {
          box-shadow: none;
          border: 1px solid var(--line);
          border-radius: 16px;
          padding: 16px;
          margin-bottom: 10px;
        }
        .card > h3 {
          break-after: avoid;
        }
        .hero {
          background: #fff;
        }
        .kpi,
        .hl div,
        .wk,
        .day,
        .ev,
        details,
        tr {
          break-inside: avoid;
        }
        .kpi {
          box-shadow: none;
          border: 1px solid var(--line);
        }
        .grid2,
        .grid2.w {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .rank {
          max-height: none;
          overflow: visible;
        }
        .sc {
          overflow: visible;
        }
        svg:not(.logo) {
          width: 100% !important;

        }

        }

        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="topin">
        <a class="brand" href="index.html"
          ><svg class="logo" viewBox="0 0 28 28">
            <rect width="28" height="28" rx="8" fill="#1d1d1f" />
            <path
              d="M8 9h12l-9 10h9"
              fill="none"
              stroke="#fff"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            /></svg
          ><span id="brand"></span
        ></a>
        <nav class="tnav">
          <a href="index.html">موجودی</a><a href="sales.html">فروش</a
          ><a href="expenses.html">هزینه‌ها</a
          ><a href="receivables.html">مطالبات</a
          ><a href="payables.html">بدهی‌ها</a><a href="todo.html">کارها</a
          ><a href="contacts.html">مخاطبین</a
          ><a href="daily.html">گزارش روزانه</a
          ><a href="reports.html" class="on">گزارش‌ها</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <div class="head">
        <div>
          <h1>گزارش ماهانه</h1>
          <p>فروش، هزینه، جریان نقدی و بدهی‌ها؛ تقویم شمسی، ساعت تهران.</p>
        </div>
        <div class="acts">
          <button class="btn g" id="csv">خروجی Excel</button
          ><button class="btn" id="pdf">ذخیره PDF</button>
        </div>
      </div>
      <div class="seg" id="strip"></div>
      <div id="out"></div>
    </main>
    <div class="pfoot" id="pfoot"></div>
    <script>
      const BRAND = "ZRCO";
      const K = {
        sales: "inventory-sales-log-v1",
        exp: "shop-expenses-log-v1",
        pinv: "purchase-invoices-v1",
        pay: "shop-payables-v1",
        rec: "shop-receivables-v1",
        prod: "inventory-manager-products-v1",
        inv: "inventory-invoices-v1",
        set: "shop-reports-settings-v1",
        rate: "inventory-usd-rate-v1",
      };
      const load = (k) => {
        try {
          const p = JSON.parse(localStorage.getItem(k) || "[]");
          return Array.isArray(p) ? p : [];
        } catch (e) {
          return [];
        }
      };
      const S = load(K.sales),
        E = load(K.exp),
        PI = load(K.pinv),
        PY = load(K.pay),
        RC = load(K.rec),
        PR = load(K.prod);
      const INV = new Map(load(K.inv).map((i) => [i.id, i])),
        PIM = new Map(PI.map((i) => [i.id, i]));
      const DRR = (() => {
        try {
          const o = JSON.parse(
            localStorage.getItem("shop-daily-reports-v1") || "{}",
          );
          return Array.isArray(o.reports) ? o.reports : [];
        } catch (e) {
          return [];
        }
      })();
      const TZ = "Asia/Tehran",
        DAY = 86400000;
      document.getElementById("brand").textContent = BRAND;
      const FA = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند",
      ];
      const CAT = {
        laptops: "لپ‌تاپ",
        phones: "موبایل",
        accessories: "لوازم جانبی",
        modem: "مودم / روتر",
        hard: "هارد",
      };
      // ---- settings (rates + targets) ----
      let SET = { rates: {}, targets: {} };
      try {
        const s = JSON.parse(localStorage.getItem(K.set) || "{}");
        if (s && typeof s === "object")
          SET = { rates: s.rates || {}, targets: s.targets || {} };
      } catch (e) {}
      const saveSet = () => {
        try {
          localStorage.setItem(K.set, JSON.stringify(SET));
        } catch (e) {}
      };
      const toLat = (s) =>
        String(s)
          .replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
          .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
          .replace(/[,،٬\s]/g, "");
      // ---- dates ----
      const jf = new Intl.DateTimeFormat("fa-IR-u-ca-persian-nu-latn", {
        timeZone: TZ,
        year: "numeric",
        month: "numeric",
        day: "numeric",
      });
      const jc = new Map();
      function jp(d) {
        d = +new Date(d);
        let r = jc.get(d);
        if (!r) {
          r = {};
          for (const p of jf.formatToParts(d))
            if (p.type !== "literal") r[p.type] = +p.value;
          jc.set(d, r);
        }
        return r;
      }
      const mk = (d) => {
        const j = jp(d);
        return j.year * 100 + j.month;
      };
      function msOf(y, m, d) {
        const key = (a, b, c) => a * 372 + b * 31 + c;
        let ms =
          Date.UTC(y + 621, 2, 21, 12) +
          Math.round((m - 1) * 30.5 + d - 1) * DAY;
        for (let i = 0; i < 80; i++) {
          const p = jp(ms);
          if (p.year === y && p.month === m && p.day === d) return ms;
          ms += (key(y, m, d) > key(p.year, p.month, p.day) ? 1 : -1) * DAY;
        }
        return ms;
      }
      const mlen = (k) => {
        const y = Math.floor(k / 100),
          m = k % 100,
          s = msOf(y, m, 1);
        let n = 0;
        while (n < 31 && jp(s + n * DAY).month === m) n++;
        return n;
      };
      const mend = (k) =>
        msOf(Math.floor(k / 100), k % 100, mlen(k)) + 8.5 * 3600000;
      const nf = new Intl.NumberFormat("fa-IR"),
        nf0 = new Intl.NumberFormat("fa-IR", { useGrouping: false });
      const fmt = (n) => nf.format(Math.round(+n || 0)),
        fn = (n) => nf0.format(n);
      const cp = (n) => {
        const a = Math.abs(n),
          s = n < 0 ? "−" : "",
          f = (x) => nf.format(+x.toFixed(1));
        return a >= 1e9
          ? s + f(a / 1e9) + " میلیارد"
          : a >= 1e6
            ? s + f(a / 1e6) + " م"
            : a >= 1e3
              ? s + f(a / 1e3) + " هزار"
              : s + fmt(a);
      };
      const fd = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      });
      const faDay = (d) => fd.format(new Date(d));
      const wf = new Intl.DateTimeFormat("fa-IR", {
        timeZone: TZ,
        weekday: "long",
      });
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
      const typeOf = (e) =>
        e.sourceInvoiceId ? "purchase" : e.type || "purchase";
      const T = " تومان";
      const nowKey = mk(new Date());
      // ---- dollar rate: remembered per month ----
      try {
        const lr = +JSON.parse(localStorage.getItem(K.rate)).rate;
        if (lr > 0) {
          const o = SET.rates[nowKey];
          if (!o || o.auto) {
            SET.rates[nowKey] = { r: lr, auto: true };
            saveSet();
          }
        }
      } catch (e) {}
      const rateOf = (k) => (SET.rates[k] ? +SET.rates[k].r : 0);
      const usd = (n, k) => {
        const r = rateOf(k);
        return r ? `≈ ${nf.format(Math.round(n / r))} دلار` : "";
      };
      // ---- cash events from edit history (when money really moved) ----
      function evOf(r) {
        const ev = [];
        let dp = 0;
        for (const h of r.history || [])
          for (const [f, c] of Object.entries(h.changes || {}))
            if (f === "amountPaid" || f.startsWith("inst_paid_")) {
              const d = (+c.after || 0) - (+c.before || 0);
              dp += d;
              ev.push({ t: +new Date(h.at), a: d });
            }
        const init = (+r.amountPaid || 0) - dp;
        if (init > 0) ev.push({ t: +new Date(r.date), a: init, init: true });
        return ev;
      }
      const RCE = RC.map((r) => ({ r, ev: evOf(r) })),
        PYE = PY.map((r) => ({ r, ev: evOf(r) }));
      function openAt(r, end) {
        if (+new Date(r.date) > end) return 0;
        let owed = +r.amountOwed || 0,
          paid = +r.amountPaid || 0;
        for (const h of r.history || []) {
          if (+new Date(h.at) <= end) continue;
          for (const [f, c] of Object.entries(h.changes || {})) {
            const d = (+c.after || 0) - (+c.before || 0);
            if (f === "amountOwed") owed -= d;
            else if (f === "amountPaid" || f.startsWith("inst_paid_"))
              paid -= d;
          }
        }
        return Math.max(0, owed - paid);
      }
      const isCredit = (s) => {
        const i = s.invoiceId && INV.get(s.invoiceId);
        return (
          (s.payment && s.payment.type === "installments") ||
          (i && i.payment && i.payment.type === "installments")
        );
      };
      const memo = new Map();
      function calc(k) {
        if (memo.has(k)) return memo.get(k);
        const sales = S.filter((s) => mk(s.date) === k),
          exps = E.filter((e) => mk(e.date) === k),
          pays = PY.filter((p) => mk(p.date) === k);
        let op = 0,
          goods = 0,
          ship = 0;
        for (const e of exps) {
          ship += +e.shipping || 0;
          if (typeOf(e) === "operating") op += +e.cost || 0;
          else goods += +e.cost || 0;
        }
        const sold = sum(sales, (s) => s.sold),
          benefit = sum(sales, (s) => s.benefit),
          credit = sum(sales.filter(isCredit), (s) => s.sold),
          end = mend(k);
        const recvCash = sum(
            RCE.flatMap((x) => x.ev).filter((e) => mk(e.t) === k),
            (e) => e.a,
          ),
          payCash = sum(
            PYE.flatMap((x) => x.ev).filter((e) => mk(e.t) === k),
            (e) => e.a,
          );
        const cashIn = sold - credit + recvCash,
          cashOut = op + goods + ship + payCash;
        const r = {
          k,
          sales,
          exps,
          pays,
          pinv: PI.filter((i) => mk(i.invoiceDate || i.createdAt) === k),
          sold,
          benefit,
          credit,
          op,
          goods,
          ship,
          spent: op + goods + ship,
          net: benefit - op - ship,
          deals: new Set(sales.map((s) => s.invoiceId || s.id)).size,
          debt: sum(pays, (p) => p.amountOwed),
          recvCash,
          payCash,
          cashIn,
          cashOut,
          flow: cashIn - cashOut,
          recOpen: sum(RC, (r) => openAt(r, end)),
          payOpen: sum(PY, (r) => openAt(r, end)),
          units: sum(sales, (s) => s.deductedQty ?? (s.deducted ? 1 : 0)),
        };
        memo.set(k, r);
        return r;
      }
      const all = new Set([nowKey]);
      [...S, ...E, ...PY, ...RC].forEach((x) => x.date && all.add(mk(x.date)));
      PI.forEach((i) => all.add(mk(i.invoiceDate || i.createdAt)));
      RC.forEach((r) =>
        (r.installments || []).forEach((i) => all.add(mk(i.dueDate))),
      );
      const keys = [...all].filter(Boolean).sort((a, b) => a - b);
      let cur = nowKey,
        onlyActive = false;
      const prevKey = (k) =>
        k % 100 === 1 ? (Math.floor(k / 100) - 1) * 100 + 12 : k - 1;
      const delta = (c, p, inv) => {
        const pc = Math.abs(p) < 1 ? null : ((c - p) / Math.abs(p)) * 100;
        if (pc === null) return "";
        const cls =
          Math.abs(pc) < 0.5 ? "flat" : (inv ? pc < 0 : pc > 0) ? "up" : "down";
        return `<div class="d ${cls}">${pc > 0 ? "↑" : "↓"} ${fn(Math.abs(pc).toFixed(0))}٪ نسبت به ماه قبل</div>`;
      };

      function story(c) {
        if (!c.sales.length && !c.exps.length && !c.pays.length)
          return "هنوز چیزی در این ماه ثبت نشده است.";
        const p = [
          c.deals
            ? `<b>${fn(c.deals)} فروش</b> به ارزش <b>${fmt(c.sold)}</b> تومان داشتید و <b>${fmt(c.benefit)}</b> تومان سود کردید.`
            : "فروشی ثبت نشده است.",
        ];
        if (c.credit)
          p.push(`<b>${fmt(c.credit)}</b> تومان از فروش‌ها اقساطی بود.`);
        if (c.spent) {
          const b = [
            ["هزینه‌های عملیاتی", c.op],
            ["خرید کالا", c.goods],
            ["هزینه ارسال", c.ship],
          ].sort((a, b) => b[1] - a[1])[0];
          p.push(
            `جمعاً <b>${fmt(c.spent)}</b> تومان خرج شد که بیشترش برای ${b[0]} بود (${fn(Math.round((b[1] / c.spent) * 100))}٪).`,
          );
        }
        p.push(
          c.net >= 0
            ? "بعد از کم کردن هزینه‌ها، ماه <b>با سود</b> تمام شد."
            : "بعد از کم کردن هزینه‌ها، ماه <b>زیان‌ده</b> بود.",
        );
        return p.join(" ");
      }
      // ---- day by day ----
      function dayBuild(c) {
        const y = Math.floor(c.k / 100),
          m = c.k % 100,
          ms1 = msOf(y, m, 1),
          N = mlen(c.k);
        const D = Array.from({ length: N + 1 }, (_, i) => ({
          i,
          ms: ms1 + (i - 1) * DAY,
          ev: [],
          s: 0,
          b: 0,
          x: 0,
        }));
        const add = (date, e) => {
          const d = D[jp(date).day];
          if (d) {
            e.t = +new Date(date);
            d.ev.push(e);
          }
          return d;
        };
        const seen = new Set();
        for (const s of c.sales) {
          const q = +s.qty || 1,
            cr = isCredit(s) ? "اقساطی" : "";
          if (s.invoiceId) {
            if (seen.has(s.invoiceId)) continue;
            seen.add(s.invoiceId);
            const L = c.sales.filter((x) => x.invoiceId === s.invoiceId),
              inv = INV.get(s.invoiceId),
              so = sum(L, (x) => x.sold),
              be = sum(L, (x) => x.benefit),
              d = add(s.date, {
                k: "فروش گروهی",
                c: "var(--violet)",
                h: `${inv ? esc(inv.number) + " · " : ""}${esc(s.customer || "بدون نام")}`,
                a: "+" + fmt(so),
                pos: 1,
                m: `سود ${fmt(be)} تومان${cr ? " · " + cr : ""}`,
                ul: L.map(
                  (x) =>
                    `${esc(x.name)} — ${fn(x.qty || 1)} عدد × ${fmt(x.unitSold ?? x.sold / (x.qty || 1))} = ${fmt(x.sold)}`,
                ),
              });
            d.s += so;
            d.b += be;
          } else {
            const d = add(s.date, {
              k: "فروش",
              c: "var(--blue)",
              h: esc(s.name) + (q > 1 ? ` × ${fn(q)}` : ""),
              a: "+" + fmt(s.sold),
              pos: 1,
              img: s.image,
              m: [
                `سود ${fmt(s.benefit)} تومان`,
                s.customer && `مشتری: ${esc(s.customer)}`,
                cr,
                s.details && esc(s.details),
              ]
                .filter(Boolean)
                .join(" · "),
            });
            d.s += +s.sold || 0;
            d.b += +s.benefit || 0;
          }
        }
        for (const e of c.exps) {
          const op = typeOf(e) === "operating",
            inv = e.sourceInvoiceId && PIM.get(e.sourceInvoiceId),
            tot = (+e.cost || 0) + (+e.shipping || 0);
          const d = add(e.date, {
            k: op ? "هزینه" : "خرید کالا",
            c: "var(--red)",
            h: esc(e.item),
            a: "−" + fmt(tot),
            neg: 1,
            img: e.image,
            m: `مبلغ ${fmt(e.cost)} + ارسال ${fmt(e.shipping)}${e.notes ? " · " + esc(e.notes) : ""}`,
            ul:
              inv &&
              inv.items.map(
                (x) =>
                  `${esc(x.name)} — ${fn(x.quantity)} عدد × ${fmt(x.purchasePrice)} = ${fmt(x.quantity * x.purchasePrice)}`,
              ),
          });
          d.x += tot;
        }
        for (const p of c.pays)
          add(p.date, {
            k: "بدهی",
            c: "var(--amber)",
            h: esc(p.name),
            a: fmt(p.amountOwed),
            m: `پرداخت‌شده ${fmt(p.amountPaid)} · مانده ${fmt(Math.max(0, p.amountOwed - p.amountPaid))}${p.notes ? " · " + esc(p.notes) : ""}`,
          });
        for (const { r, ev } of PYE)
          ev.filter((e) => !e.init && mk(e.t) === c.k && e.a > 0).forEach((e) =>
            add(e.t, {
              k: "پرداخت بدهی",
              c: "var(--amber)",
              h: esc(r.name),
              a: "−" + fmt(e.a),
              neg: 1,
            }),
          );
        for (const { r, ev } of RCE) {
          if (mk(r.date) === c.k)
            add(r.date, {
              k: "طلب",
              c: "var(--green)",
              h: esc(r.name),
              a: fmt(r.amountOwed),
              m: `دریافت‌شده ${fmt(r.amountPaid)}${r.notes ? " · " + esc(r.notes) : ""}`,
            });
          ev.filter((e) => !e.init && mk(e.t) === c.k && e.a > 0).forEach((e) =>
            add(e.t, {
              k: "دریافت قسط",
              c: "var(--green)",
              h: esc(r.name),
              a: "+" + fmt(e.a),
              pos: 1,
            }),
          );
          (r.installments && r.installments.length
            ? r.installments
            : r.dueDate
              ? [
                  {
                    dueDate: r.dueDate,
                    amount: r.amountOwed,
                    paid: r.amountPaid,
                    label: "",
                  },
                ]
              : []
          ).forEach((i) => {
            if (mk(i.dueDate) === c.k) {
              const d = D[jp(i.dueDate).day];
              d &&
                d.ev.push({
                  t: +new Date(i.dueDate) + DAY / 2,
                  k: +i.paid >= +i.amount ? "سررسید (پرداخت شد)" : "سررسید قسط",
                  c: "var(--mut)",
                  h: esc(r.name) + (i.label ? ` (${esc(i.label)})` : ""),
                  a: fmt(i.amount),
                  m: +i.paid >= +i.amount ? "" : `پرداخت‌شده ${fmt(i.paid)}`,
                });
            }
          });
        }
        for (const r of DRR) {
          const dt = new Date(r.day + "T12:00:00Z");
          if (mk(dt) !== c.k) continue;
          add(dt, {
            k: "گزارش روزانه",
            c: "var(--violet)",
            h: esc(r.manager || "بدون نام"),
            a: r.status === "submitted" ? "ثبت شده" : "پیش‌نویس",
            m: esc((r.summary || "").slice(0, 300)),
            ul: (r.tasks || []).filter((t) => t.done).map((t) => esc(t.t)),
          });
        }
        D.forEach((d) => d.ev.sort((a, b) => a.t - b.t));
        return D.slice(1);
      }
      const evHtml = (e) =>
        `<div class="ev"><i class="dot" style="background:${e.c}"></i><div class="evb"><div class="h"><span><em style="color:${e.c}">${e.k}</em>${e.h}</span><b class="${e.pos ? "pos" : e.neg ? "neg" : ""}">${e.a}</b></div>${e.m ? `<div class="m">${e.m}</div>` : ""}${e.ul && e.ul.length ? `<ul>${e.ul.map((u) => `<li>${u}</li>`).join("")}</ul>` : ""}${e.img ? `<img class="th" src="${e.img}" alt="">` : ""}</div></div>`;
      function daysHtml(c) {
        const D = dayBuild(c),
          mx = Math.max(1, ...D.map((d) => Math.max(d.s, d.x))),
          tk = nowKey === c.k ? jp(new Date()).day : 0;
        return (
          D.filter((d) => !onlyActive || d.ev.length)
            .map((d, ix) => {
              const fri = new Date(d.ms).getUTCDay() === 5,
                has = d.ev.length;
              return `<div class="day rv ${fri ? "fri" : ""} ${tk === d.i ? "today" : ""} ${has ? "" : "quiet"}" id="day-${d.i}" style="transition-delay:${(ix % 5) * 50}ms">
    <div class="db"><b>${fn(d.i)}</b><small>${wf.format(d.ms)}${tk === d.i ? " · امروز" : ""}</small></div>
    <div>${
      has
        ? `<div class="dchips">${d.s ? `<span style="color:var(--blue)">فروش ${fmt(d.s)}</span><span style="color:var(--green)">سود ${fmt(d.b)}</span>` : ""}${d.x ? `<span style="color:var(--red)">هزینه ${fmt(d.x)}</span>` : ""}</div>
    <div class="dbar"><i style="--w:${(d.s / mx) * 55}%;background:var(--blue)"></i><i style="--w:${(d.b / mx) * 55}%;background:var(--green)"></i><i style="--w:${(d.x / mx) * 55}%;background:var(--red)"></i></div>${d.ev.map(evHtml).join("")}`

  <section class="grid2">
    <div class="card rv"><h3>بدهی‌های ثبت‌شده</h3><p class="sub">پولی که فروشگاه بدهکار شد، با تاریخ همین ماه.</p>${db.h}</div>
    <div class="card rv"><h3>اقساط سررسید مشتریان</h3><p class="sub">مطالباتی که این ماه سررسید می‌شوند.</p>${db.rh}</div>
  </section>
  <section class="card pb"><h3>خط زمانی روز به روز</h3><p class="sub">از اول تا آخر ماه، هر روز با همه جزئیاتش. جمعه‌ها کرم‌رنگ‌اند.</p>
    <div class="tools"><input class="srch" id="q" placeholder="جستجو در خط زمانی: مشتری، کالا، تأمین‌کننده…"><button class="btn g" id="tog">${onlyActive ? "نمایش همه روزها" : "فقط روزهای فعال"}</button></div>
    <div class="days" id="days">${daysHtml(c)}</div></section>
  <section class="card rv"><h3>نمای کلی سال ${fn(y)}</h3><p class="sub">ماه‌های بدون داده کم‌رنگ‌اند. روی هر ماه بزنید.</p>${yearChart(cur)}</section>
  <div class="foot">${BRAND} · ساخته‌شده از داده‌های فروش، هزینه، فاکتور، مطالبات و بدهی‌های همین برنامه</div>`;
        wire();
        countUp();
        reveal();
      }
      function wire() {
        const $ = (id) => document.getElementById(id);
        $("tog").onclick = () => {
          onlyActive = !onlyActive;
          render();
          $("tog").scrollIntoView({ block: "center" });
        };
        $("q").oninput = (e) => {
          const q = e.target.value.trim().toLowerCase();
          document.querySelectorAll(".day").forEach((d) => {
            let any = false;
            d.querySelectorAll(".ev").forEach((ev) => {
              const ok = !q || ev.textContent.toLowerCase().includes(q);
              ev.style.display = ok ? "" : "none";
              any = any || ok;
            });
            d.style.display = !q || any ? "" : "none";
          });
        };
        $("rate").onclick = () => {
          const v = toLat(
            prompt("نرخ دلار این ماه (تومان):", rateOf(cur) || "") || "",
          );
          if (+v > 0) {
            SET.rates[cur] = { r: +v, auto: false };
            saveSet();
            render();
          }
        };
        $("tgt").onclick = () => {
          const v = prompt(
            "هدف سود خالص این ماه (تومان). برای حذف خالی بگذارید:",
            SET.targets[cur] || "",
          );
          if (v === null) return;
          const n = +toLat(v);
          if (n > 0) SET.targets[cur] = n;
          else delete SET.targets[cur];
          saveSet();
          render();
        };
        document
          .querySelectorAll("svg g[data-k]")
          .forEach((g) => (g.onclick = () => go(+g.dataset.k)));
        document.querySelectorAll(".sc rect[data-day]").forEach(
          (r) =>
            (r.onclick = () => {
              let el = $("day-" + r.dataset.day);
              if (!el) {
                onlyActive = false;
                render();
                el = $("day-" + r.dataset.day);
              }
              if (el) {
                el.classList.add("in");
                el.scrollIntoView({ behavior: "smooth", block: "center" });
                el.classList.remove("flash");
                void el.offsetWidth;
                el.classList.add("flash");
              }
            }),
        );
        document
          .querySelectorAll(".th")
          .forEach((i) => (i.onclick = () => i.classList.toggle("big")));
      }
      function countUp() {
        document.querySelectorAll(".cnt").forEach((el) => {
          const v = +el.dataset.v,
            t0 = performance.now();
          (function step(t) {
            const p = Math.min(1, (t - t0) / 1200),
              e = 1 - Math.pow(1 - p, 4);
            el.textContent = (v < 0 ? "−" : "") + fmt(Math.abs(v) * e);
            if (p < 1) requestAnimationFrame(step);
          })(t0);
        });
      }
      function reveal() {
        const io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                io.unobserve(e.target);
              }
            }),
          { threshold: 0.06 },
        );
        document.querySelectorAll(".rv").forEach((el) => io.observe(el));
      }
      function strip() {
        document.getElementById("strip").innerHTML = keys
          .map(
            (k) =>
              `<button class="${k === cur ? "on" : ""}" data-k="${k}">${FA[(k % 100) - 1]} ${fn(Math.floor(k / 100))}</button>`,
          )
          .join("");
        const on = document.querySelector("#strip .on");
        on && on.scrollIntoView({ inline: "center", block: "nearest" });
      }
      function go(k) {
        cur = k;
        strip();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function csv() {
        const c = calc(cur),
          q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"',
          rows = [
            [
              "تاریخ",
              "نوع",
              "شرح",
              "مبلغ (تومان)",
              "سود (تومان)",
              "طرف حساب",
              "توضیحات",
            ],
          ];
        c.sales.forEach((s) =>
          rows.push([
            faDay(s.date),
            "فروش",
            s.name + ((+s.qty || 1) > 1 ? " × " + s.qty : ""),
            s.sold,
            s.benefit,
            s.customer || "",
            s.details || "",
          ]),
        );
        c.exps.forEach((e) =>
          rows.push([
            faDay(e.date),
            typeOf(e) === "operating" ? "هزینه عملیاتی" : "خرید کالا",
            e.item,
            -((+e.cost || 0) + (+e.shipping || 0)),
            "",
            "",
            e.notes || "",
          ]),
        );
        c.pays.forEach((p) =>
          rows.push([
            faDay(p.date),
            "بدهی",
            p.name,
            p.amountOwed,
            "",
            "",
            p.notes || "",
          ]),
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob(
            ["\ufeff" + rows.map((r) => r.map(q).join(",")).join("\r\n")],
            { type: "text/csv;charset=utf-8" },
          ),
        );
        a.download = `report-${cur}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      document.getElementById("strip").onclick = (e) => {
        const b = e.target.closest("[data-k]");
        if (b) go(+b.dataset.k);
      };
      document.getElementById("pdf").onclick = () => window.print();
      document.getElementById("csv").onclick = csv;
      window.addEventListener("beforeprint", () => {
        document.querySelectorAll("details").forEach((d) => (d.open = true));
        document.querySelectorAll(".rv").forEach((r) => r.classList.add("in"));
      });
      strip();
      render();
    </script>
  </body>
</html>
