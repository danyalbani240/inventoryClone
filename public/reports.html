<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="stylesheet" href="index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>گزارش ماهانه</title>
    <style>
      :root {
        --ink: #2a2d6b;
        --mint: #2ec4a6;
        --sun: #ffc233;
        --coral: #ff6b81;
        --lilac: #8b7bf7;
        --sky: #4aa8ff;
        --soft: #f1f3fd;
      }
      @page {
        size: A4;
        margin: 12mm;
      }
      body {
        font-family: Vazirmatn, Tahoma, "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #f3f1ff, #eefaf7 60%, #fff7ec) fixed;
        direction: rtl;
      }
      .container {
        width: min(1200px, calc(100% - 32px)) !important;
      }
      .nav {
        flex-wrap: wrap;
      }
      h1 {
        margin: 0 0 4px;
        font-size: clamp(26px, 5vw, 38px);
      }
      .subtitle {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .bar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 18px;
      }
      .strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 2px 12px;
        flex: 1;
        scrollbar-width: thin;
      }
      .chip {
        flex: none;
        border: 2px solid #fff;
        background: #fff;
        border-radius: 999px;
        padding: 8px 16px;
        font: 700 13px inherit;
        font-family: inherit;
        color: var(--muted);
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0 4px 12px rgba(100, 90, 200, 0.08);
      }
      .chip:hover {
        transform: translateY(-3px) rotate(-2deg);
        color: var(--ink);
      }
      .chip.on {
        background: linear-gradient(135deg, var(--lilac), var(--sky));
        color: #fff;
        transform: scale(1.07);
      }
      .btn {
        border: 0;
        border-radius: 14px;
        padding: 11px 18px;
        font: 700 14px inherit;
        font-family: inherit;
        background: linear-gradient(135deg, var(--lilac), var(--sky));
        color: #fff;
        cursor: pointer;
        flex: none;
        transition: 0.2s;
        box-shadow: 0 6px 16px rgba(110, 100, 230, 0.3);
      }
      .btn:hover {
        transform: translateY(-2px) scale(1.04);
      }
      .btn.ghost {
        background: #fff;
        color: var(--ink);
        box-shadow: none;
        border: 2px solid var(--soft);
      }
      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 34px;
        padding: 36px;
        color: #fff;
        background: linear-gradient(120deg, #3b3a9e, #6a4fd8, #2a8fd8, #3b3a9e);
        background-size: 300% 300%;
        animation: flow 12s ease infinite;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: center;
        margin-bottom: 20px;
      }
      .hero > * {
        position: relative;
      }
      .fx {
        position: absolute !important;
        font-size: 26px;
        opacity: 0.55;
        animation: float 7s ease-in-out infinite;
        pointer-events: none;
      }
      .hero h2 {
        margin: 0;
        font-size: clamp(46px, 9vw, 96px);
        line-height: 1.1;
        font-weight: 800;
        animation: pop 0.8s both;
      }
      .hero .en {
        opacity: 0.8;
        font-weight: 700;
        margin: 4px 0 14px;
        font-size: 18px;
      }
      .story {
        margin: 0;
        max-width: 62ch;
        line-height: 2;
        opacity: 0.95;
      }
      .story b {
        color: var(--sun);
      }
      .net {
        text-align: center;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(8px);
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 30px;
        padding: 20px 30px;
        min-width: 240px;
        animation: pop 0.9s 0.2s both;
      }
      .mood {
        font-size: 60px;
        display: inline-block;
        animation: bob 2.4s ease-in-out infinite;
      }
      .net .val {
        font-size: 30px;
        font-weight: 800;
        margin: 4px 0;
      }
      .net .val.neg {
        color: #ffc4cc;
      }
      .net .lbl {
        opacity: 0.85;
        font-size: 13px;
      }
      .conf {
        position: absolute !important;
        top: -30px;
        font-size: 22px;
        animation: fall 3.2s linear forwards;
        pointer-events: none;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
      }
      .kpi {
        background: #fff;
        border-radius: 24px;
        padding: 16px;
        box-shadow: 0 10px 24px color-mix(in srgb, var(--c) 22%, transparent);
        border-bottom: 6px solid var(--c);
        animation: pop 0.6s both;
        animation-delay: calc(var(--i) * 90ms);
        transition: 0.25s;
      }
      .kpi:hover {
        transform: translateY(-6px) rotate(-1.5deg);
      }
      .kpi .e {
        font-size: 26px;
        display: inline-block;
        animation: bob 3s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.3s);
      }
      .kpi .k {
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }
      .kpi .v {
        font-size: 20px;
        font-weight: 800;
        margin: 4px 0;
      }
      .d {
        font-size: 12px;
        font-weight: 700;
      }
      .up {
        color: var(--success);
      }
      .down {
        color: var(--danger);
      }
      .flat {
        color: var(--muted);
      }
      .hl {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .hl div {
        background: #fff;
        border: 2px dashed #d5d9f3;
        border-radius: 20px;
        padding: 14px;
        font-size: 13px;
        color: var(--muted);
        transition: 0.3s;
      }
      .hl div:hover {
        border-color: var(--lilac);
        transform: scale(1.03);
      }
      .hl span {
        font-size: 26px;
        display: block;
        animation: wig 3.5s ease-in-out infinite;
      }
      .hl b {
        display: block;
        color: var(--ink);
        font-size: 14px;
        margin-top: 3px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .row.w {
        grid-template-columns: 1.5fr 1fr;
      }
      .panel {
        background: #fff;
        border-radius: 28px;
        padding: 22px;
        box-shadow: 0 10px 30px rgba(100, 90, 200, 0.09);
        margin-bottom: 18px;
        min-width: 0;
      }
      .row .panel {
        margin-bottom: 0;
      }
      .panel h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .panel .sub {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
      }
      svg {
        max-width: 100%;
        display: block;
      }
      .sc {
        overflow-x: auto;
      }
      .rise {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: rise 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
        animation-delay: calc(var(--i) * 25ms);
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 8px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-left: 5px;
        background: var(--c);
      }
      .donutwrap {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }
      .donut {
        animation: spin 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) both;
      }
      .donut circle.seg {
        animation: dash 1.2s 0.1s cubic-bezier(0.3, 0.8, 0.3, 1) both;
      }
      .rank {
        max-height: 340px;
        overflow: auto;
        padding-left: 4px;
      }
      .rk {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 10px;
        padding: 8px 0;
        border-bottom: 1px dashed #e3e6f6;
        font-size: 13px;
      }
      .rk .n {
        font-weight: 700;
      }
      .rk .a {
        font-weight: 800;
        white-space: nowrap;
      }
      .rk .t {
        grid-column: 1/3;
        height: 9px;
        background: var(--soft);
        border-radius: 9px;
        overflow: hidden;
      }
      .rk .t i {
        display: block;
        height: 100%;
        width: var(--w);
        background: var(--c);
        border-radius: 9px;
        animation: fill 1s ease both;
        animation-delay: calc(var(--i) * 60ms);
      }
      .rk small {
        color: var(--muted);
      }
      .tg {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        border-radius: 99px;
        padding: 2px 9px;
        margin-right: 6px;
      }
      .tg.operating {
        background: #ffe1e5;
        color: #b3243a;
      }
      .tg.purchase {
        background: #dcecff;
        color: #1e56a8;
      }
      table {
        min-width: 0 !important;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        padding: 8px 10px !important;
        text-align: right;
      }
      .num {
        white-space: nowrap;
      }
      .tw {
        overflow-x: auto;
      }
      details {
        border: 2px solid var(--soft);
        border-radius: 18px;
        margin-bottom: 10px;
        background: #fbfbff;
      }
      summary {
        cursor: pointer;
        padding: 12px 14px;
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      details[open] {
        animation: pop 0.4s both;
      }
      details .tw {
        padding: 0 10px 10px;
      }
      .st {
        font-size: 11px;
        font-weight: 700;
        border-radius: 99px;
        padding: 2px 9px;
      }
      .st.ok {
        background: #d9f7e8;
        color: #166534;
      }
      .st.warn {
        background: #fff0c2;
        color: #92400e;
      }
      .st.bad {
        background: #ffe1e5;
        color: #991b1b;
      }
      .empty {
        padding: 26px;
        text-align: center;
        color: var(--muted);
      }
      .tools {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .days {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .rv {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
        transition:
          opacity 0.6s,
          transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .rv.in {
        opacity: 1;
        transform: none;
      }
      .day {
        display: grid;
        grid-template-columns: 78px 1fr;
        gap: 14px;
        background: var(--soft);
        border-radius: 24px;
        padding: 12px;
        border: 2px solid transparent;
      }
      .day.fri {
        background: #fff4e2;
      }
      .day.today {
        border-color: var(--lilac);
        animation: pulse 2s infinite;
      }
      .day.quiet {
        padding: 8px 12px;
        opacity: 0.7;
      }
      .day.quiet .db b {
        font-size: 18px;
      }
      .db {
        background: #fff;
        border-radius: 18px;
        text-align: center;
        padding: 8px 2px;
        align-self: start;
        box-shadow: 0 4px 10px rgba(100, 90, 200, 0.1);
      }
      .db b {
        display: block;
        font-size: 26px;
        color: var(--ink);
      }
      .db small {
        color: var(--muted);
        font-size: 11px;
      }
      .dchips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .dchips span {
        border-radius: 99px;
        padding: 3px 10px;
        background: #fff;
      }
      .dbar {
        display: flex;
        gap: 3px;
        height: 6px;
        margin-bottom: 8px;
      }
      .dbar i {
        display: block;
        border-radius: 6px;
        width: var(--w);
        animation: fill 1s both;
      }
      .ev {
        background: #fff;
        border-radius: 16px;
        padding: 9px 12px;
        margin-top: 7px;
        border-right: 5px solid var(--c);
        font-size: 13px;
      }
      .ev .h {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-weight: 700;
      }
      .ev .m {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
        line-height: 1.8;
      }
      .ev ul {
        margin: 4px 0 0;
        padding-right: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .printhead {
        display: none;
      }
      @keyframes rise {
        from {
          transform: scaleY(0);
        }
      }
      @keyframes fill {
        from {
          width: 0;
        }
      }
      @keyframes dash {
        from {
          stroke-dasharray: 0 100;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.9);
        }
      }
      @keyframes bob {
        50% {
          transform: translateY(-8px) rotate(7deg);
        }
      }
      @keyframes float {
        50% {
          transform: translate(20px, -26px) rotate(15deg);
        }
      }
      @keyframes flow {
        50% {
          background-position: 100% 50%;
        }
      }
      @keyframes spin {
        from {
          transform: rotate(-120deg) scale(0.6);
          opacity: 0;
        }
      }
      @keyframes fall {
        to {
          transform: translateY(420px) rotate(360deg);
          opacity: 0;
        }
      }
      @keyframes wig {
        0%,
        90%,
        100% {
          transform: rotate(0);
        }
        93% {
          transform: rotate(-14deg);
        }
        97% {
          transform: rotate(12deg);
        }
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 8px rgba(139, 123, 247, 0.18);
        }
      }
      @media (max-width: 860px) {
        .hero,
        .row,
        .row.w {
          grid-template-columns: 1fr;
        }
        .hero {
          padding: 26px 20px;
        }
        .day {
          grid-template-columns: 60px 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .rv {
          opacity: 1;
          transform: none;
        }
      }
      @media print {
        html {
          font-size: 11px;
        }
        body {
          background: #fff !important;
        }
        .nav,
        .bar,
        .tools,
        .fx,
        .conf,
        #more {
          display: none !important;
        }
        * {
          animation: none !important;
          transition: none !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .rv {
          opacity: 1 !important;
          transform: none !important;
        }
        .container {
          width: 100% !important;
          padding: 0 !important;
        }
        .printhead {
          display: flex;
          justify-content: space-between;
          border-bottom: 3px solid var(--lilac);
          padding-bottom: 6px;
          margin-bottom: 10px;
          font-weight: 700;
          color: var(--ink);
        }
        h1,
        .subtitle {
          display: none;
        }
        .hero {
          border-radius: 18px;
          padding: 18px;
          background: #3b3a9e !important;
          break-inside: avoid;
        }
        .panel {
          box-shadow: none;
          border: 1px solid #dcdff3;
          border-radius: 16px;
          padding: 14px;
          margin-bottom: 10px;
        }
        .panel > h3 {
          break-after: avoid;
        }
        .kpi,
        .hl div,
        .day,
        .ev,
        details,
        tr {
          break-inside: avoid;
        }
        .kpi {
          box-shadow: none;
          border: 1px solid #dcdff3;
        }
        .row,
        .row.w {
          grid-template-columns: 1fr 1fr;
        }
        .rank {
          max-height: none;
          overflow: visible;
        }
        .sc {
          overflow: visible;
        }
        svg {
          width: 100% !important;
          min-width: 0 !important;
          height: auto;
        }
        .days {
          gap: 6px;
        }
        .day {
          border: 1px solid #dcdff3;
        }
        .panel.pb {
          break-before: page;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <nav class="nav">
        <a href="index.html">موجودی</a><a href="sales.html">فروش</a
        ><a href="expenses.html">هزینه‌ها</a>
        <a href="receivables.html">مطالبات</a><a href="payables.html">بدهی‌ها</a
        ><a href="todo.html">کارها</a> <a href="contacts.html">مخاطبین</a
        ><a href="reports.html" class="active">گزارش‌ها</a>
      </nav>
      <h1>گزارش ماهانه</h1>
      <p class="subtitle">
        ماه را انتخاب کنید تا ببینید چه فروختید، چه خرج کردید و چقدر بدهکارید.
        تقویم شمسی، ساعت تهران.
      </p>
      <div class="bar">
        <div class="strip" id="strip"></div>
        <button class="btn" id="pdf">🖨️ ذخیره PDF</button>
      </div>
      <div id="out"></div>
    </main>
    <script>
      const K = {
        sales: "inventory-sales-log-v1",
        exp: "shop-expenses-log-v1",
        pinv: "purchase-invoices-v1",
        pay: "shop-payables-v1",
        rec: "shop-receivables-v1",
        prod: "inventory-manager-products-v1",
        inv: "inventory-invoices-v1",
      };
      const load = (k) => {
        try {
          const p = JSON.parse(localStorage.getItem(k) || "[]");
          return Array.isArray(p) ? p : [];
        } catch (e) {
          return [];
        }
      };
      const S = load(K.sales),
        E = load(K.exp),
        PI = load(K.pinv),
        PY = load(K.pay),
        RC = load(K.rec),
        PR = load(K.prod);
      const INV = new Map(load(K.inv).map((i) => [i.id, i])),
        PIM = new Map(PI.map((i) => [i.id, i]));
      const TZ = "Asia/Tehran",
        DAY = 86400000;
      const FA = [
        "فروردین",
        "اردیبهشت",
        "خرداد",
        "تیر",
        "مرداد",
        "شهریور",
        "مهر",
        "آبان",
        "آذر",
        "دی",
        "بهمن",
        "اسفند",
      ];
      const CAT = {
        laptops: "لپ‌تاپ",
        phones: "موبایل",
        accessories: "لوازم جانبی",
        modem: "مودم / روتر",
        hard: "هارد",
      };
      const jf = new Intl.DateTimeFormat("fa-IR-u-ca-persian-nu-latn", {
        timeZone: TZ,
        year: "numeric",
        month: "numeric",
        day: "numeric",
      });
      const jc = new Map();
      function jp(d) {
        d = +new Date(d);
        let r = jc.get(d);
        if (!r) {
          r = {};
          for (const p of jf.formatToParts(d))
            if (p.type !== "literal") r[p.type] = +p.value;
          jc.set(d, r);
        }
        return r;
      }
      const mk = (d) => {
        const j = jp(d);
        return j.year * 100 + j.month;
      };
      function msOf(y, m, d) {
        const key = (a, b, c) => a * 372 + b * 31 + c;
        let ms =
          Date.UTC(y + 621, 2, 21, 12) +
          Math.round((m - 1) * 30.5 + d - 1) * DAY;
        for (let i = 0; i < 80; i++) {
          const p = jp(ms);
          if (p.year === y && p.month === m && p.day === d) return ms;
          ms += (key(y, m, d) > key(p.year, p.month, p.day) ? 1 : -1) * DAY;
        }
        return ms;
      }
      const nf = new Intl.NumberFormat("fa-IR"),
        nf0 = new Intl.NumberFormat("fa-IR", { useGrouping: false });
      const fmt = (n) => nf.format(Math.round(+n || 0)),
        fn = (n) => nf0.format(n);
      const cp = (n) => {
        const a = Math.abs(n),
          s = n < 0 ? "−" : "",
          f = (x) => nf.format(+x.toFixed(1));
        return a >= 1e9
          ? s + f(a / 1e9) + " میلیارد"
          : a >= 1e6
            ? s + f(a / 1e6) + " م"
            : a >= 1e3
              ? s + f(a / 1e3) + " هزار"
              : s + fmt(a);
      };
      const fd = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      });
      const faDay = (d) => fd.format(new Date(d));
      const tf = new Intl.DateTimeFormat("fa-IR", {
          timeZone: TZ,
          hour: "2-digit",
          minute: "2-digit",
        }),
        wf = new Intl.DateTimeFormat("fa-IR", {
          timeZone: TZ,
          weekday: "long",
        });
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({

      const memo = new Map();

          benefit = sum(sales, (s) => s.benefit),

          pays,

          sold,
          benefit,

          goods,

      function story(c) {

      function dayBuild(c) {

          g += `<g data-k="${c.k}" style="cursor:pointer"><rect x="${x - 4}" y="0" width="56" height="${H + 34}" rx="14" fill="${on ? "#f1f3fd" : "transparent"}"/>
    <rect class="rise" style="--i:${i * 2}" x="${x + 26}" y="${H - hs}" width="18" height="${hs}" rx="6" fill="var(--lilac)"><title>${FA[i]}: فروش ${fmt(c.sold)}</title></rect>
    <rect class="rise" style="--i:${i * 2 + 1}" x="${x + 4}" y="${H - hx}" width="18" height="${hx}" rx="6" fill="var(--coral)"><title>${FA[i]}: هزینه ${fmt(c.spent)}</title></rect>
    <text x="${x + 24}" y="${H + 14}" font-size="10" text-anchor="middle" font-weight="${on ? 800 : 500}" fill="#2a2d6b">${FA[i]}</text>
    <text x="${x + 24}" y="${H + 27}" font-size="9" text-anchor="middle" fill="${c.net < 0 ? "#dc2626" : "#059669"}">${c.sold || c.spent ? cp(c.net) : ""}</text></g>`;
        });
        return `<div class="sc"><svg viewBox="0 0 720 ${H + 34}" width="720" style="min-width:620px">${g}</svg></div>
  <div class="legend"><span><i style="--c:var(--lilac)"></i>فروش</span><span><i style="--c:var(--coral)"></i>هزینه</span><span>عدد زیر هر ماه = سود خالص. روی ماه بزنید تا باز شود.</span></div>`;
      }
      const kpi = (i, col, e, k, v, d) =>
        `<div class="kpi" style="--c:${col};--i:${i}"><span class="e" style="--i:${i}">${e}</span><div class="k">${k}</div><div class="v"><span class="cnt" data-v="${v}">۰</span><small style="font-size:12px;color:var(--muted)">${T}</small></div>${d}</div>`;

      function render() {
        const c = calc(cur),
          p = calc(prevKey(cur)),
          m = cur % 100,
          y = Math.floor(cur / 100),
          hasP = p.sales.length || p.exps.length || p.pays.length;
        const sp = salesParts(c),
          db = debts(c);
        const byDay = {};
        c.sales.forEach((s) => {
          const d = jp(s.date).day;
          byDay[d] = (byDay[d] || 0) + (+s.sold || 0);
        });
        const best = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
        const bigE = c.exps
          .slice()
          .sort(
            (a, b) =>
              (+b.cost || 0) +
              (+b.shipping || 0) -
              ((+a.cost || 0) + (+a.shipping || 0)),
          )[0];
        const seller = [...sp.items.values()].sort((a, b) => b.q - a.q)[0];
        const hl = [
          best &&
            `<div><span>🏆</span>بهترین روز فروش<b>${fn(best[0])} ${FA[m - 1]} · ${fmt(best[1])}${T}</b></div>`,
          seller &&
            `<div><span>⭐</span>پرفروش‌ترین کالا<b>${esc(seller.n)} · ${fn(seller.q)} عدد</b></div>`,
          bigE &&
            `<div><span>💸</span>بزرگ‌ترین هزینه<b>${esc(bigE.item)} · ${fmt((+bigE.cost || 0) + (+bigE.shipping || 0))}</b></div>`,
          sp.cs[0] &&
            `<div><span>🙋</span>بهترین مشتری<b>${esc(sp.cs[0].n)} · ${fmt(sp.cs[0].v)}</b></div>`,
          c.sold > 0 &&
            `<div><span>📈</span>حاشیه سود<b>${fn(((c.benefit / c.sold) * 100).toFixed(1))}٪ از فروش</b></div>`,
        ]
          .filter(Boolean)
          .join("");
        const D = (a, b, inv) =>
          hasP
            ? delta(a, b, inv)
            : '<div class="d flat">اولین ماه دارای داده</div>';
        const fx = ["💰", "🪙", "✨", "💎", "🌟", "🐷"]
          .map(
            (e, i) =>
              `<span class="fx" style="left:${8 + i * 16}%;top:${10 + (i % 3) * 28}%;animation-delay:${-i * 1.3}s">${e}</span>`,
          )
          .join("");
        document.getElementById("out").innerHTML = `
  <div class="printhead"><span>🐷 گزارش ماهانه فروشگاه — ${FA[m - 1]} ${fn(y)}</span><span>تاریخ تهیه: ${faDay(new Date())}</span></div>
  <section class="hero" id="hero">${fx}
    <div><h2>${FA[m - 1]}</h2><div class="en">${fn(y)}</div><p class="story">${story(c)}</p></div>
    <div class="net"><div class="mood">${!c.sales.length && !c.exps.length ? "😴" : c.net >= 0 ? "🤩" : "🥺"}</div><div class="lbl">سود خالص</div>
    <div class="val ${c.net < 0 ? "neg" : ""}"><span class="cnt" data-v="${c.net}">۰</span></div><div class="lbl">تومان، بعد از هزینه‌های فروشگاه</div></div>
  </section>
  <section class="kpis">
    ${kpi(0, "var(--lilac)", "🛒", "جمع فروش", c.sold, D(c.sold, p.sold))}
    ${kpi(1, "var(--mint)", "🌱", "سود فروش", c.benefit, D(c.benefit, p.benefit))}
    ${kpi(2, "var(--coral)", "🔥", "هزینه از سود", c.op + c.ship, D(c.op + c.ship, p.op + p.ship, 1))}
    ${kpi(3, "var(--sky)", "📦", "خرید کالا", c.goods, D(c.goods, p.goods, 1))}
    ${kpi(4, "var(--sun)", "🧮", "بدهی‌های جدید", c.debt, D(c.debt, p.debt, 1))}
    ${kpi(5, "var(--ink)", "⏰", "اقساط سررسیدشده مشتریان", db.dueTot, `<div class="d flat">${fmt(db.dueGot)} دریافت شده</div>`)}
  </section>
  ${hl ? `<section class="hl">${hl}</section>` : ""}
  <section class="panel"><h3>📊 نمودار روزانه</h3><p class="sub">روی هر ستون بروید تا عدد دقیق را ببینید. روز اول سمت راست است.</p>${daily(c)}</section>
  <section class="row w">
    <div class="panel"><h3>💸 پول را کجا خرج کردیم؟</h3><p class="sub">همه هزینه‌ها بر اساس عنوان، از بیشترین به کمترین.</p>${rank(expenseRows(c), "var(--coral)")}</div>
    <div class="panel"><h3>🍩 سهم هر هزینه</h3><p class="sub">هزینه عملیاتی و ارسال از سود کم می‌شود، خرید کالا نه.</p>${donut(c)}</div>
  </section>
  <section class="panel"><h3>📦 فاکتورهای خرید از تأمین‌کننده</h3><p class="sub">فاکتور را باز کنید تا کالاها، تعداد و قیمت‌ها را ببینید.</p>${invoicesHtml(c)}</section>
  <section class="row">
    <div class="panel"><h3>⭐ پرفروش‌ها</h3><p class="sub">بر اساس مبلغ فروش.</p>${rank(sp.top, "var(--lilac)")}</div>
    <div class="panel"><h3>🗂️ دسته‌بندی</h3><p class="sub">کدام بخش بیشتر فروخت؟</p>${rank(sp.cl, "var(--mint)")}<h3 style="margin-top:18px">🙋 بهترین مشتریان</h3>${rank(sp.cs, "var(--sky)")}</div>
  </section>
  <section class="row">
    <div class="panel"><h3>🧮 بدهی‌های ثبت‌شده</h3><p class="sub">پولی که فروشگاه بدهکار است، با تاریخ همین ماه.</p>${db.h}</div>
    <div class="panel"><h3>⏰ اقساط سررسید مشتریان</h3><p class="sub">مطالباتی که این ماه سررسید می‌شوند.</p>${db.rh}</div>
  </section>
  <section class="panel pb"><h3>🗓️ خط زمانی روز به روز</h3><p class="sub">از اول تا آخر ماه، هر روز با همه جزئیاتش. جمعه‌ها نارنجی هستند.</p>
    <div class="tools"><button class="btn ghost" id="tog">${onlyActive ? "نمایش همه روزها" : "فقط روزهای فعال"}</button></div>
    <div class="days" id="days">${daysHtml(c)}</div></section>
  <section class="panel"><h3>🌈 نمای کلی سال ${fn(y)}</h3><p class="sub">هر دوازده ماه کنار هم.</p>${yearChart(cur)}</section>`;
        document.getElementById("tog").onclick = () => {
          onlyActive = !onlyActive;
          render();
          document.getElementById("tog").scrollIntoView({ block: "center" });
        };
        document
          .querySelectorAll(".yr g,svg g[data-k]")
          .forEach((g) => (g.onclick = () => go(+g.dataset.k)));
        countUp();
        reveal();
        if (c.net > 0) confetti();
      }
      function countUp() {
        document.querySelectorAll(".cnt").forEach((el) => {
          const v = +el.dataset.v,
            t0 = performance.now();
          (function step(t) {
            const p = Math.min(1, (t - t0) / 1100),
              e = 1 - Math.pow(1 - p, 3);
            el.textContent = (v < 0 ? "−" : "") + fmt(Math.abs(v) * e);
            if (p < 1) requestAnimationFrame(step);
          })(t0);
        });
      }
      function reveal() {
        const io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                io.unobserve(e.target);
              }
            }),
          { threshold: 0.08 },
        );
        document.querySelectorAll(".rv").forEach((el) => io.observe(el));
      }
      function confetti() {
        const h = document.getElementById("hero");
        for (let i = 0; i < 22; i++) {
          const s = document.createElement("span");
          s.className = "conf";
          s.textContent = ["🎉", "✨", "🪙", "💖", "⭐"][i % 5];
          s.style.left = Math.random() * 100 + "%";
          s.style.animationDelay = Math.random() * 1.2 + "s";
          h.appendChild(s);
          setTimeout(() => s.remove(), 5000);
        }
      }
      function strip() {
        document.getElementById("strip").innerHTML = keys
          .map(
            (k) =>
              `<button class="chip ${k === cur ? "on" : ""}" data-k="${k}">${FA[(k % 100) - 1]} ${fn(Math.floor(k / 100))}</button>`,
          )
          .join("");
        const on = document.querySelector(".chip.on");
        on && on.scrollIntoView({ inline: "center", block: "nearest" });
      }
      function go(k) {
        cur = k;
        strip();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      document.getElementById("strip").onclick = (e) => {
        const b = e.target.closest("[data-k]");
        if (b) go(+b.dataset.k);
      };
      document.getElementById("pdf").onclick = () => window.print();
      window.addEventListener("beforeprint", () => {
        document.querySelectorAll("details").forEach((d) => (d.open = true));
        document.querySelectorAll(".rv").forEach((r) => r.classList.add("in"));
      });
      strip();
      render();
    </script>
  </body>
</html>
